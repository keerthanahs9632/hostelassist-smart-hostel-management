# Spring Boot Server Port
server.port=8080

# Database Configuration (MySQL)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/hostelassist?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:hostelassist_super_secure_jwt_secret_key_2026_spring_boot_production_token}
app.jwt.expiration-ms=604800000

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=./uploads

# AI Configuration
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=gemini-3.8-flash

# Logging
logging.level.com.hostelassist=DEBUG
logging.level.org.springframework.security=INFO
